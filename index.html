<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKOSH — Social</title>
<meta name="description" content="AKOSH original social network">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#07080d;--panel:#0e1018;--panel2:#151925;--line:#252a3a;--text:#f7f8ff;--muted:#9299aa;--blue:#5b7cff;--purple:#9b5cff;--pink:#ff4f91;--red:#ff3040;--green:#35d07f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#22275a55,transparent 65%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 50% 0,#2a367555,transparent 70%)}.auth-card{width:min(430px,100%);background:#0d1019ee;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 30px 100px #0008}.logo{font-weight:900;letter-spacing:-2px;font-size:42px;background:linear-gradient(90deg,#fff,#7e8fff,#bd70ff);-webkit-background-clip:text;color:transparent}.tag{color:var(--muted);margin:6px 0 26px}.field{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#090c13;color:#fff;outline:none;margin:7px 0}.field:focus{border-color:var(--blue)}.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:800}.primary{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;width:100%;margin-top:10px}.ghost{background:#171b27;color:#fff;width:100%;margin-top:10px}.link{background:none;border:0;color:#8fa3ff;padding:8px 0}.small{font-size:13px;color:var(--muted)}.error{color:#ff718b;font-size:13px;min-height:18px}.app{min-height:100vh}.top{height:66px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:#07080ddd;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:26px;font-weight:900;letter-spacing:-1.5px}.search{width:min(420px,38vw);background:#131722;border:1px solid var(--line);padding:11px 14px;border-radius:14px;color:#fff}.layout{display:grid;grid-template-columns:230px minmax(0,680px) 300px;gap:28px;max-width:1280px;margin:auto;padding:24px}.side{position:sticky;top:90px;height:max-content}.nav{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;color:#dfe3ee;margin:4px 0;background:none;border:0;width:100%;text-align:left}.nav:hover,.nav.active{background:#151a28}.card{background:#0d1018;border:1px solid var(--line);border-radius:20px}.stories{display:flex;gap:16px;overflow:auto;padding:17px}.story{min-width:72px;text-align:center;font-size:12px}.avatar{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ff4f91,#7a6cff,#39d5ff);margin:auto}.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #0d1018}.post{margin-top:16px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:14px}.post-head .avatar{width:40px;height:40px}.post-user{font-weight:800}.post-time{color:var(--muted);font-size:12px}.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#111}.actions{display:flex;gap:8px;padding:12px 14px 0}.iconbtn{background:none;border:0;color:#fff;font-size:23px;padding:2px}.likebtn.liked{color:var(--red)}.like-count{font-weight:800;padding:5px 14px 0}.caption{padding:8px 14px 6px}.comments-preview{padding:0 14px 12px;color:#ddd}.comment-row{display:flex;gap:8px;margin-top:7px}.comment-row b{font-size:13px}.comment-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}.comment-input input{flex:1;background:#111521;border:1px solid var(--line);border-radius:12px;padding:10px;color:#fff}.comment-input button{border:0;background:none;color:#8fa3ff;font-weight:800}.right-card{padding:18px;margin-bottom:15px}.person{display:flex;align-items:center;gap:10px;padding:10px 0}.person .avatar{width:42px;height:42px}.follow{margin-left:auto;border:0;background:#fff;color:#111;border-radius:10px;padding:8px 12px;font-weight:800}.profile{padding:24px}.profile-head{display:flex;gap:24px;align-items:center}.profile-head .avatar{width:100px;height:100px}.stats{display:flex;gap:30px;margin-top:16px}.stat{background:none;border:0;color:#fff;text-align:left}.stat b{display:block;font-size:19px}.stat span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:24px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}.modal-box{width:min(560px,100%);max-height:82vh;overflow:auto;background:#10131d;border:1px solid var(--line);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:#fff;font-size:24px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-top:10px}.tab{flex:1;background:none;border:0;color:var(--muted);padding:12px}.tab.active{color:#fff;border-bottom:2px solid var(--blue)}.bottom{display:none}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.search-result{padding:8px 0}.search-result button{background:none;border:0;color:#fff;width:100%;text-align:left}.create-box textarea{min-height:100px;resize:vertical}
@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,680px)}.right{display:none}}@media(max-width:720px){.top{padding:0 14px}.search{display:none}.layout{display:block;padding:10px 8px}.side{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#090b12ee;border-top:1px solid var(--line);z-index:30;justify-content:space-around}.bottom .nav{width:auto}.main{padding-bottom:75px}.card{border-radius:15px}.auth-card{padding:25px}.profile-head{align-items:flex-start}.stats{gap:18px}.grid{margin-left:-8px;margin-right:-8px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">AKOSH</div><div class="tag">Odamlar bilan bog‘lan. Ulash. Kashf et.</div><div id="authTitle" style="font-size:22px;font-weight:800">AKOSH'ga kirish</div>
<div id="authForm"><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Parol"><button class="btn primary" onclick="login()">Kirish</button><button class="link" onclick="showReset()">Parolni unutdingizmi?</button><button class="btn ghost" onclick="showRegister()">Ro‘yxatdan o‘tish</button></div>
<div id="resetForm" class="hidden"><input id="resetEmail" class="field" type="email" placeholder="Email"><button class="btn primary" onclick="resetPassword()">Yangi parol uchun havola yuborish</button><button class="link" onclick="showLogin()">Kirishga qaytish</button></div>
<div id="registerForm" class="hidden"><input id="regName" class="field" placeholder="Ism"><input id="regUsername" class="field" placeholder="Username (@siz)"><input id="regEmail" class="field" type="email" placeholder="Email"><input id="regPassword" class="field" type="password" placeholder="Parol"><button class="btn primary" onclick="register()">Akkaunt yaratish</button><button class="link" onclick="showLogin()">Kirishga qaytish</button></div>
<div id="authMsg" class="error"></div><div class="small">Username orqali AKOSH'da boshqa akkauntlarni qidirish mumkin.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">AKOSH</div><div style="position:relative;width:min(420px,38vw)"><input id="search" class="search" style="width:100%" placeholder="🔎 Username qidirish..." oninput="searchUsers()"><div id="searchResults" class="card hidden" style="position:absolute;top:54px;left:0;right:0;padding:8px;z-index:60"></div></div><button class="btn ghost" style="width:auto;margin:0;padding:9px 14px" onclick="logout()">Chiqish</button></header>
<div class="layout"><aside class="side"><button class="nav active" onclick="showHome()">🏠 Bosh sahifa</button><button class="nav" onclick="showExplore()">🔎 Kashf qilish</button><button class="nav" onclick="showReels()">🎬 Reels</button><button class="nav" onclick="showMessages()">💬 Xabarlar</button><button class="nav" onclick="showProfile()">👤 Profil</button><button class="nav" onclick="openCreate()">➕ Yaratish</button></aside><main id="main" class="main"></main><aside class="right"><div class="card right-card"><b>Siz kuzatishingiz mumkin</b><div id="suggestions"></div></div><div class="card right-card small">© 2026 AKOSH · Qoidalar · Maxfiylik</div></aside></div>
<nav class="bottom"><button class="nav" onclick="showHome()">🏠</button><button class="nav" onclick="showExplore()">🔎</button><button class="nav" onclick="openCreate()">➕</button><button class="nav" onclick="showReels()">🎬</button><button class="nav" onclick="showProfile()">👤</button></nav></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<script>
const cfg=window.AKOSH_CONFIG||{};let sb=null,user=null;let demo=false;let demoUsers=[{id:'u1',username:'akosh',display_name:'AKOSH',avatar_url:'https://i.pravatar.cc/150?img=12'},{id:'u2',username:'creator_uz',display_name:'Creator UZ',avatar_url:'https://i.pravatar.cc/150?img=32'},{id:'u3',username:'gaminglife',display_name:'Gaming Life',avatar_url:'https://i.pravatar.cc/150?img=13'}];
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function msg(t){document.getElementById('authMsg').textContent=t}
function showLogin(){authTitle.textContent="AKOSH'ga kirish";authForm.classList.remove('hidden');resetForm.classList.add('hidden');registerForm.classList.add('hidden');msg('')}
function showReset(){authTitle.textContent='Parolni tiklash';authForm.classList.add('hidden');resetForm.classList.remove('hidden');registerForm.classList.add('hidden');msg('')}
function showRegister(){authTitle.textContent='Yangi akkaunt yaratish';authForm.classList.add('hidden');resetForm.classList.add('hidden');registerForm.classList.remove('hidden');msg('')}
async function init(){if(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&!cfg.SUPABASE_URL.includes('YOUR_')&&!cfg.SUPABASE_KEY.includes('YOUR_')){sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);const {data}=await sb.auth.getSession();if(data.session){user=data.session.user;enterApp()}else{demo=false}}else{demo=true}}
async function login(){if(demo){user={id:'demo',email:email.value,username:'akosh_user',display_name:'AKOSH User'};enterApp();return}const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg(error.message);user=data.user;await ensureProfile();enterApp()}
async function register(){const username=regUsername.value.trim().replace(/^@/,'').toLowerCase();if(!regEmail.value||!regPassword.value||!username)return msg('Barcha maydonlarni to‘ldiring.');if(!/^[a-z0-9._]{3,30}$/.test(username))return msg('Username 3-30 ta harf, raqam, nuqta yoki _ bo‘lsin.');if(demo){user={id:'demo-'+Date.now(),email:regEmail.value,username,display_name:regName.value||username};enterApp();return}const {data,error}=await sb.auth.signUp({email:regEmail.value,password:regPassword.value,options:{data:{username,display_name:regName.value||username}}});if(error)return msg(error.message);if(!data.user)return msg('Akkaunt yaratilmadi.');user=data.user;await ensureProfile();if(!data.session)return msg('Akkaunt yaratildi. Emailingizni tasdiqlang, keyin Kirish orqali kiring.');enterApp()}
async function ensureProfile(){if(!sb||!user)return;const p={id:user.id,username:user.user_metadata?.username||('user_'+user.id.slice(0,8)),display_name:user.user_metadata?.display_name||'AKOSH User'};const r=await sb.from('profiles').upsert(p,{onConflict:'id'});if(r.error)console.log(r.error)}
async function resetPassword(){if(!resetEmail.value)return msg('Email kiriting.');if(demo)return msg('Demo rejimida parol tiklash uchun Supabase ulang.');const {error}=await sb.auth.resetPasswordForEmail(resetEmail.value,{redirectTo:location.origin});if(error)return msg(error.message);msg('Parol tiklash havolasi emailingizga yuborildi.')}
async function logout(){if(sb)await sb.auth.signOut();user=null;app.classList.add('hidden');auth.classList.remove('hidden');showLogin()}
function enterApp(){auth.classList.add('hidden');app.classList.remove('hidden');showHome();loadSuggestions()}
async function me(){if(demo)return {id:user?.id||'demo',username:user?.username||'akosh_user',display_name:user?.display_name||'AKOSH User',avatar_url:'https://i.pravatar.cc/150?img=12'};const r=await sb.from('profiles').select('*').eq('id',user.id).single();return r.data||{id:user.id,username:user.user_metadata?.username||'user',display_name:user.user_metadata?.display_name||'User',avatar_url:''}}
function avatar(url){return url||'https://i.pravatar.cc/150?img=12'}
async function showHome(){if(demo){main.innerHTML=demoFeed();return}const r=await sb.from('posts').select('id,user_id,media_url,media_type,caption,created_at,profiles(id,username,display_name,avatar_url)').order('created_at',{ascending:false}).limit(30);const posts=r.data||[];if(!posts.length){main.innerHTML=`<div class="card empty"><h2>AKOSH</h2><p>Hozircha postlar yo‘q. Birinchi postingizni yarating! 🚀</p><button class="btn primary" style="max-width:260px" onclick="openCreate()">Post yaratish</button></div>`;return}main.innerHTML=posts.map(p=>postHTML(p)).join('');await hydratePosts(posts)}
function demoFeed(){return `<section class="card stories">${[demoUsers[0],demoUsers[1],demoUsers[2]].map(x=>`<div class="story"><div class="avatar"><img src="${avatar(x.avatar_url)}"></div><div>${esc(x.username)}</div></div>`).join('')}</section>${demoUsers.slice(1).map((p,i)=>`<article class="card post"><div class="post-head"><div class="avatar"><img src="${avatar(p.avatar_url)}"></div><div><div class="post-user">@${esc(p.username)}</div><div class="post-time">Demo post</div></div></div><img class="post-img" src="https://picsum.photos/seed/akosh${i+30}/900/900"><div class="actions"><button class="iconbtn likebtn" onclick="demoLike(this)">♡</button><button class="iconbtn" onclick="openComments('demo')">💬</button><button class="iconbtn">↗</button></div><div class="like-count">0 likes</div><div class="caption"><b>@${esc(p.username)}</b> AKOSH'dagi post 🚀</div></article>`).join('')}`}
function demoLike(btn){btn.classList.toggle('liked');btn.textContent=btn.classList.contains('liked')?'♥':'♡';const c=btn.closest('.post').querySelector('.like-count');c.textContent=(btn.classList.contains('liked')?'1':'0')+' likes'}
function postHTML(p){return `<article class="card post" id="post-${p.id}"><div class="post-head"><div class="avatar"><img src="${avatar(p.profiles?.avatar_url)}"></div><div><div class="post-user">@${esc(p.profiles?.username||'user')}</div><div class="post-time">${new Date(p.created_at).toLocaleString('uz-UZ')}</div></div></div>${p.media_type==='video'?`<video class="post-img" src="${p.media_url}" controls></video>`:`<img class="post-img" src="${p.media_url}" loading="lazy">`}<div class="actions"><button class="iconbtn likebtn" data-post="${p.id}" onclick="toggleLike('${p.id}',this)">♡</button><button class="iconbtn" onclick="openComments('${p.id}')">💬</button><button class="iconbtn">↗</button><button class="iconbtn" style="margin-left:auto">🔖</button></div><div class="like-count" id="likes-${p.id}">0 likes</div><div class="caption"><b>@${esc(p.profiles?.username||'user')}</b> ${esc(p.caption)}</div><div class="comments-preview" id="comments-${p.id}"></div><div class="comment-input"><input id="comment-input-${p.id}" placeholder="Izoh yozing..." onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button onclick="addComment('${p.id}')">Yuborish</button></div></article>`}
async function hydratePosts(posts){for(const p of posts){const lc=await sb.from('likes').select('*',{count:'exact',head:true}).eq('post_id',p.id);document.getElementById('likes-'+p.id).textContent=(lc.count||0)+' likes';const mine=await sb.from('likes').select('post_id').eq('post_id',p.id).eq('user_id',user.id).maybeSingle();const btn=document.querySelector(`[data-post="${p.id}"]`);if(btn&&mine.data){btn.classList.add('liked');btn.textContent='♥'}const c=await sb.from('comments').select('id,body,created_at,profiles(username)').eq('post_id',p.id).order('created_at',{ascending:true}).limit(3);const box=document.getElementById('comments-'+p.id);if(box)box.innerHTML=(c.data||[]).map(x=>`<div class="comment-row"><b>@${esc(x.profiles?.username||'user')}</b><span>${esc(x.body)}</span></div>`).join('')}}
async function toggleLike(postId,btn){if(demo){demoLike(btn);return}const existing=await sb.from('likes').select('user_id').eq('user_id',user.id).eq('post_id',postId).maybeSingle();if(existing.data){await sb.from('likes').delete().eq('user_id',user.id).eq('post_id',postId);btn.classList.remove('liked');btn.textContent='♡'}else{await sb.from('likes').insert({user_id:user.id,post_id:postId});btn.classList.add('liked');btn.textContent='♥'}const c=await sb.from('likes').select('*',{count:'exact',head:true}).eq('post_id',postId);document.getElementById('likes-'+postId).textContent=(c.count||0)+' likes'}
async function addComment(postId){if(demo)return openComments(postId);const input=document.getElementById('comment-input-'+postId);const body=input.value.trim();if(!body)return;const r=await sb.from('comments').insert({post_id:postId,user_id:user.id,body});if(r.error)return alert(r.error.message);input.value='';const c=await sb.from('comments').select('id,body,created_at,profiles(username)').eq('post_id',postId).order('created_at',{ascending:true}).limit(3);document.getElementById('comments-'+postId).innerHTML=(c.data||[]).map(x=>`<div class="comment-row"><b>@${esc(x.profiles?.username||'user')}</b><span>${esc(x.body)}</span></div>`).join('')}
async function openComments(postId){modal.classList.remove('hidden');if(demo){modalBox.innerHTML=`<div class="modal-head"><h2>Izohlar</h2><button class="close" onclick="closeModal()">×</button></div><p class="small">Demo rejimida izohlar faqat ko‘rinish uchun.</p><input class="field" placeholder="Izoh yozing..."><button class="btn primary">Yuborish</button>`;return}const c=await sb.from('comments').select('body,created_at,profiles(username,avatar_url)').eq('post_id',postId).order('created_at',{ascending:true});modalBox.innerHTML=`<div class="modal-head"><h2>Izohlar</h2><button class="close" onclick="closeModal()">×</button></div>${(c.data||[]).map(x=>`<div class="person"><div class="avatar"><img src="${avatar(x.profiles?.avatar_url)}"></div><div><b>@${esc(x.profiles?.username||'user')}</b><div>${esc(x.body)}</div></div></div>`).join('')||'<div class="empty">Hozircha izoh yo‘q.</div>'}`}
function showExplore(){main.innerHTML=`<div class="card profile"><h2>Kashf qilish</h2><p class="small">AKOSH'dagi yangi postlar.</p><div class="grid">${Array.from({length:9},(_,i)=>`<img src="https://picsum.photos/seed/explore${i}/700/700">`).join('')}</div></div>`}
function showReels(){main.innerHTML=`<div class="card empty"><div style="font-size:45px">🎬</div><h2>AKOSH Reels</h2><p>Qisqa videolar.</p><button class="btn primary" style="max-width:260px" onclick="openCreate()">Reels yaratish</button></div>`}
function showMessages(){main.innerHTML=`<div class="card empty"><div style="font-size:45px">💬</div><h2>Xabarlar</h2><p>Do‘stlaringiz bilan yozishing.</p></div>`}
async function showProfile(){const p=await me();let followers=0,following=0,posts=0;if(sb&&!demo){followers=(await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',user.id)).count||0;following=(await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',user.id)).count||0;posts=(await sb.from('posts').select('*',{count:'exact',head:true}).eq('user_id',user.id)).count||0}else{followers=12;following=followingDemoCount();posts=3}main.innerHTML=profileHTML(p,posts,followers,following)}
function followingDemoCount(){return 0}function profileHTML(p,posts,followers,followingCount){return `<div class="card profile"><div class="profile-head"><div class="avatar"><img src="${avatar(p.avatar_url)}"></div><div><h2 style="margin:0">${esc(p.display_name||p.username)}</h2><div class="small">@${esc(p.username)}</div><p>${esc(p.bio||'AKOSH creator 🚀')}</p><div class="stats"><button class="stat" onclick="openList('followers')"><b>${followers}</b><span>Obunachi</span></button><button class="stat" onclick="openList('following')"><b>${followingCount}</b><span>Obuna</span></button><button class="stat"><b>${posts}</b><span>Post</span></button></div></div></div><div class="tabs"><button class="tab active">Postlar</button><button class="tab">Reels</button><button class="tab">Saqlangan</button></div></div>`}
async function openList(type){const title=type==='followers'?'Obunachilar':'Obuna bo‘lganlar';let list=[];if(sb&&!demo){const col=type==='followers'?'follower_id':'following_id';const r=await sb.from('follows').select(col).eq(type==='followers'?'following_id':'follower_id',user.id);const ids=(r.data||[]).map(x=>x[col]);if(ids.length){const q=await sb.from('profiles').select('*').in('id',ids);list=q.data||[]}}else list=demoUsers.slice(0,3);modal.classList.remove('hidden');modalBox.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${list.length?list.map(x=>`<div class="person"><div class="avatar"><img src="${avatar(x.avatar_url)}"></div><div><b>@${esc(x.username)}</b><div class="small">${esc(x.display_name||'')}</div></div><button class="follow">Profil</button></div>`).join(''):`<div class="empty">Hozircha ro‘yxat bo‘sh.</div>`}`}
function closeModal(){modal.classList.add('hidden')}
function openCreate(){modal.classList.remove('hidden');modalBox.innerHTML=`<div class="modal-head"><h2>Yangi post</h2><button class="close" onclick="closeModal()">×</button></div><div class="create-box"><input id="postUrl" class="field" placeholder="Rasm URL manzili"><textarea id="postCaption" class="field" placeholder="Izoh yozing..."></textarea><button class="btn primary" onclick="createPost()">Joylash</button></div>`}
async function createPost(){if(demo)return alert('Haqiqiy post joylash uchun Supabase ulang.');const media=postUrl.value.trim();if(!media)return alert('Rasm URL kiriting.');const r=await sb.from('posts').insert({user_id:user.id,media_url:media,media_type:'image',caption:postCaption.value.trim()});if(r.error)return alert(r.error.message);closeModal();showHome()}
async function loadSuggestions(){if(demo){suggestions.innerHTML=demoUsers.slice(1).map(x=>personHTML(x)).join('');return}const r=await sb.from('profiles').select('*').neq('id',user.id).limit(5);suggestions.innerHTML=(r.data||[]).map(x=>personHTML(x)).join('')||'<div class="small">Boshqa akkauntlar topilmadi.</div>'}
function personHTML(x){return `<div class="person"><div class="avatar"><img src="${avatar(x.avatar_url)}"></div><div><b>@${esc(x.username)}</b><div class="small">${esc(x.display_name||'')}</div></div><button class="follow" onclick="toggleFollow('${x.id}',this)">Kuzatish</button></div>`}
async function toggleFollow(id,btn){if(demo){btn.textContent=btn.textContent==='Kuzatish'?'Obuna bo‘ldingiz':'Kuzatish';return}const q=await sb.from('follows').select('*').eq('follower_id',user.id).eq('following_id',id).maybeSingle();if(q.data){await sb.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);btn.textContent='Kuzatish'}else{await sb.from('follows').insert({follower_id:user.id,following_id:id});btn.textContent='Obuna bo‘ldingiz'}}
let searchTimer;async function searchUsers(){clearTimeout(searchTimer);const q=search.value.trim().replace(/^@/,'');if(!q){searchResults.classList.add('hidden');return}searchTimer=setTimeout(async()=>{if(demo){const list=demoUsers.filter(x=>x.username.toLowerCase().includes(q.toLowerCase()));renderSearch(list);return}const r=await sb.from('profiles').select('id,username,display_name,avatar_url').ilike('username','%'+q+'%').order('username').limit(20);renderSearch(r.data||[])},180)}
function renderSearch(list){searchResults.classList.remove('hidden');searchResults.innerHTML=list.length?list.map(x=>`<div class="search-result"><button onclick="openUser('${x.id}')"><div class="person"><div class="avatar"><img src="${avatar(x.avatar_url)}"></div><div><b>@${esc(x.username)}</b><div class="small">${esc(x.display_name||'')}</div></div></div></button></div>`).join(''):'<div class="empty" style="padding:20px">Bunday akkaunt topilmadi.</div>'}
async function openUser(id){searchResults.classList.add('hidden');if(demo){const p=demoUsers.find(x=>x.id===id);main.innerHTML=`<div class="card profile"><div class="profile-head"><div class="avatar"><img src="${avatar(p.avatar_url)}"></div><div><h2>${esc(p.display_name)}</h2><div class="small">@${esc(p.username)}</div></div></div></div>`;return}const r=await sb.from('profiles').select('*').eq('id',id).single();if(!r.data)return;const p=r.data;const followers=(await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',id)).count||0;const following=(await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',id)).count||0;const posts=(await sb.from('posts').select('*',{count:'exact',head:true}).eq('user_id',id)).count||0;main.innerHTML=`<div class="card profile"><div class="profile-head"><div class="avatar"><img src="${avatar(p.avatar_url)}"></div><div><h2 style="margin:0">${esc(p.display_name||p.username)}</h2><div class="small">@${esc(p.username)}</div><p>${esc(p.bio||'')}</p><div class="stats"><button class="stat"><b>${followers}</b><span>Obunachi</span></button><button class="stat"><b>${following}</b><span>Obuna</span></button><button class="stat"><b>${posts}</b><span>Post</span></button></div><button class="follow" onclick="toggleFollow('${id}',this)">Kuzatish</button></div></div></div>`}
search.addEventListener('blur',()=>setTimeout(()=>searchResults.classList.add('hidden'),200));
init();
</script>
</body></html>
